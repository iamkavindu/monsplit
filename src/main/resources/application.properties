# Application
spring.application.name=monsplit
server.port=8080

# Database (uses Docker Compose PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:15432/monsplitdb
spring.datasource.username=user
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Vaadin
vaadin.launch-browser=false
vaadin.devmode-caching=false
vaadin.url-mapping=/monsplit/*

vaadin.frontend.hotdeploy=true
vaadin.react.enable=false

# Logging
logging.level.root=INFO
#logging.level.dev.iamkavindu.monsplit=DEBUG
#logging.level.org.springframework.security=DEBUG

spring.jpa.hibernate.ddl-auto=validate

# Vaadin Production
vaadin.productionMode=true
vaadin.clean.build.frontend.files=true

# CI/CD: Enforce strict dependency versions (npm ci)
vaadin.ci.build=true

# Logging
logging.level.root=WARN
